name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#8250df&color_dots=#ebedf0,#e4dbfb,#c4a9f5,#9a6ee8,#8250df
            dist/snake-dark.svg?palette=github-dark&color_snake=#a371f7&color_dots=#161b22,#2c1f4a,#4b2f86,#7848c8,#a371f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
